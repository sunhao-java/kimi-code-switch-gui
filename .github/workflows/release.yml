name: Release Installers

# Tauri 打包流水线（与原 Electron 版能力对齐）：
# test → create-release（中英双语 release note）→ build（Tauri 打包 + 校验和 + 上传）
# → update-homebrew-tap（更新 homebrew-kimi-code-switch tap）。
# 触发：推送 v* 标签。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # cargo test 需要 frontendDist（../dist）存在：generate_context! 在编译期校验该路径。
      - name: Build renderer (provide frontendDist for cargo test)
        run: npm run build:web

      - name: Run Rust tests
        run: cd src-tauri && cargo test

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bilingual release notes from CHANGELOGS
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION_NO_V="${VERSION#v}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          ZH="${RUNNER_TEMP}/zh.md"
          EN="${RUNNER_TEMP}/en.md"
          extract() {
            local src="$1" out="$2"
            awk -v ver="${VERSION_NO_V}" '
              $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' "$src" | awk 'NF { found = 1 } found { print }' > "$out"
          }
          extract CHANGELOGS/zh-CN.md "$ZH"
          extract CHANGELOGS/en-US.md "$EN"
          {
            if [ -s "$ZH" ]; then
              echo "## 中文 (zh-CN)"
              echo
              cat "$ZH"
            fi
            if [ -s "$ZH" ] && [ -s "$EN" ]; then
              echo
              echo "---"
              echo
            fi
            if [ -s "$EN" ]; then
              echo "## English (en-US)"
              echo
              cat "$EN"
            fi
          } > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOGS missing entry for ${VERSION_NO_V}; will fall back to auto-generated notes." >&2
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        shell: bash
        run: |
          if [ "${HAS_NOTES}" = "true" ]; then
            gh release view "${VERSION}" >/dev/null 2>&1 \
              && gh release edit "${VERSION}" --notes-file "${NOTES_FILE}" \
              || gh release create "${VERSION}" --notes-file "${NOTES_FILE}"
          else
            gh release view "${VERSION}" >/dev/null 2>&1 \
              || gh release create "${VERSION}" --generate-notes
          fi

  build:
    name: Build ${{ matrix.os-name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os-name: macos
            arch: arm64
            bundle: dmg
            ext: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            os-name: macos
            arch: x64
            bundle: dmg
            ext: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os-name: windows
            arch: x64
            bundle: nsis
            ext: exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 不传 tagName：仅构建，不由 tauri-action 创建/上传 release，
          # 由后续步骤按 Electron 命名规则重命名后再上传。
          args: --target ${{ matrix.target }}

      - name: Rename bundle to canonical asset name
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          OS_NAME: ${{ matrix.os-name }}
          ARCH: ${{ matrix.arch }}
          BUNDLE: ${{ matrix.bundle }}
          EXT: ${{ matrix.ext }}
        shell: bash
        run: |
          VERSION_NO_V="${VERSION#v}"
          SRC="$(find "src-tauri/target/${TARGET}/release/bundle/${BUNDLE}" -maxdepth 1 -type f -name "*.${EXT}" | head -1)"
          test -n "${SRC}"
          mkdir -p dist-release
          if [ "${OS_NAME}" = "macos" ]; then
            OUT="kimi-code-switch-gui-${VERSION_NO_V}-mac-${ARCH}.dmg"
          else
            OUT="kimi-code-switch-gui-${VERSION_NO_V}-win-${ARCH}-setup.exe"
          fi
          cp "${SRC}" "dist-release/${OUT}"
          echo "Renamed '${SRC}' -> dist-release/${OUT}"

      - name: Generate checksums
        env:
          SUMS_FILE: SHA256SUMS-${{ matrix.os-name }}-${{ matrix.arch }}.txt
        shell: bash
        run: |
          node -e "const fs=require('fs');const c=require('crypto');const p=require('path');const dir='dist-release';const out=process.env.SUMS_FILE;const files=fs.readdirSync(dir).filter((f)=>!f.startsWith('SHA256SUMS'));const lines=files.map((f)=>c.createHash('sha256').update(fs.readFileSync(p.join(dir,f))).digest('hex')+'  '+f);fs.writeFileSync(p.join(dir,out),lines.join('\n')+'\n');"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          test -n "$(find dist-release -maxdepth 1 -type f -print -quit)"
          find dist-release -maxdepth 1 -type f -exec gh release upload "${VERSION}" {} --clobber \;

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      TAP_REPO_URL: https://github.com/sunhao-java/homebrew-kimi-code-switch.git
      TAP_REPO_DIR: homebrew-kimi-code-switch
      CASK_PATH: Casks/kimi-code-switch-gui.rb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub token for tap repo
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          test -n "${TAP_GITHUB_TOKEN}"

      - name: Download macOS DMGs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts
          gh release download "${VERSION}" --pattern "*.dmg" --dir artifacts

      - name: Compute release checksums
        id: checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NO_V="${VERSION#v}"
          ARM64_FILE="artifacts/kimi-code-switch-gui-${VERSION_NO_V}-mac-arm64.dmg"
          AMD64_FILE="artifacts/kimi-code-switch-gui-${VERSION_NO_V}-mac-x64.dmg"
          test -f "${ARM64_FILE}"
          test -f "${AMD64_FILE}"
          echo "arm64=$(sha256sum "${ARM64_FILE}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "amd64=$(sha256sum "${AMD64_FILE}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Clone tap repository
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@${TAP_REPO_URL#https://}" "${TAP_REPO_DIR}"

      - name: Render cask
        env:
          VERSION: ${{ github.ref_name }}
          GITHUB_REPO: ${{ github.repository }}
          ARM64_SHA256: ${{ steps.checksums.outputs.arm64 }}
          AMD64_SHA256: ${{ steps.checksums.outputs.amd64 }}
        run: |
          VERSION_NO_V="${VERSION#v}"
          python scripts/render_homebrew_cask.py \
            --version "${VERSION_NO_V}" \
            --github-repo "${GITHUB_REPO}" \
            --arm64-sha256 "${ARM64_SHA256}" \
            --amd64-sha256 "${AMD64_SHA256}" \
            --output "${TAP_REPO_DIR}/${CASK_PATH}"

      - name: Commit and push tap update
        working-directory: ${{ env.TAP_REPO_DIR }}
        env:
          VERSION: ${{ github.ref_name }}
          CASK_PATH: ${{ env.CASK_PATH }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CASK_PATH}"
          if git diff --cached --quiet; then
            echo "No tap changes to commit."
            exit 0
          fi
          git commit -m "chore: update kimi-code-switch-gui ${VERSION#v}"
          git push origin HEAD
